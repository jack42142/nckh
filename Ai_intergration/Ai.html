<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Local Chatbot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Khung Chat Chính */
    .chat-container {
      width: 400px;
      height: 550px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Tiêu đề Khung Chat */
    .chat-header {
      background-color: #2b3a4a;
      color: #ffffff;
      padding: 15px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header .status-dot {
      width: 10px;
      height: 10px;
      background-color: #28a745;
      border-radius: 50%;
    }

    /* Vùng Hiển Thị Tin Nhắn */
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bot-message {
      background-color: #e9ecef;
      color: #212529;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .user-message {
      background-color: #007bff;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    /* Ô Nhập Tin Nhắn */
    .chat-input-container {
      display: flex;
      padding: 12px;
      border-top: 1px solid #dee2e6;
      background-color: #fff;
    }

    .chat-input {
      flex: 1;
      border: 1px solid #ced4da;
      border-radius: 20px;
      padding: 8px 15px;
      outline: none;
      font-size: 14px;
    }

    .chat-input:focus {
      border-color: #007bff;
    }

    .send-btn {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      margin-left: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .send-btn:hover {
      background-color: #0056b3;
    }

    .send-btn:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div class="status-dot"></div>
      <span>Test</span>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot-message">
        Xin chào! Model Hugging Face đã sẵn sàng. Hãy nhập câu hỏi của bạn.
      </div>
    </div>

    <form class="chat-input-container" id="chatForm">
      <input type="text" id="userInput" class="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off" required>
      <button type="submit" id="sendBtn" class="send-btn">Gửi</button>
    </form>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // Hàm hiển thị tin nhắn lên UI
    function appendMessage(text, sender) {
      const messageElement = document.createElement('div');
      messageElement.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
      messageElement.textContent = text;
      chatMessages.appendChild(messageElement);
      
      // Cuộn xuống tin nhắn mới nhất
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return messageElement;
    }

    // Xử lý gửi dữ liệu tới Backend Python
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      // Hiển thị tin nhắn người dùng
      appendMessage(message, 'user');
      userInput.value = '';

      // Vô hiệu hóa nút gửi trong lúc chờ phản hồi
      sendBtn.disabled = true;
      const botMessageElement = appendMessage('Đang suy nghĩ...', 'bot');

      try {
        const response = await fetch('http://127.0.0.1:8000/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ prompt: message })
        });

        if (!response.ok) {
          throw new Error(`Lỗi server: ${response.status}`);
        }

        const data = await response.json();
        botMessageElement.textContent = data.response;
      } catch (err) {
        botMessageElement.textContent = '❌ Không thể kết nối tới Server Python (localhost:8000). Hãy đảm bảo bạn đã bật file server.py!';
        console.error('Lỗi API:', err);
      } finally {
        sendBtn.disabled = false;
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    });
  </script>

</body>
</html>
